name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn[standard] pytest httpx pyjwt passlib[bcrypt] sqlmodel python-multipart pydantic[email]

    - name: Run tests with pytest
      run: |
        pip install pytest-cov
        pytest tests/test_auth.py --cov=app --cov-report=xml

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=donaciones_app_key
          -Dsonar.organization=tu-organizacion-de-github
          -Dsonar.sources=app
          -Dsonar.python.coverage.reportPaths=coverage.xml

    - name: Set up background application
      run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &

    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:8000'
        # Añadimos opciones para no fallar la build inmediatamente por alertas,
        # permitiéndonos revisar el reporte primero.
        cmd_options: '-r zap_report.html'
      continue-on-error: true

    - name: Upload ZAP report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: zap_report.html
